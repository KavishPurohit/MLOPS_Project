name: tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MLFLOW_DISABLE_AGENT_HINT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11', cache: pip, cache-dependency-path: requirements.txt}
      - run: python -m pip install -r requirements.txt
      - name: Download official FD001 data
        run: |
          python - <<'PY'
          import io, urllib.request, zipfile
          from pathlib import Path
          url = "https://data.nasa.gov/docs/legacy/CMAPSSData.zip"
          payload = urllib.request.urlopen(url, timeout=60).read()
          archive = zipfile.ZipFile(io.BytesIO(payload))
          output = Path("data/raw")
          output.mkdir(parents=True, exist_ok=True)
          for name in ("train_FD001.txt", "test_FD001.txt", "RUL_FD001.txt"):
              (output / name).write_bytes(archive.read(name))
          PY
      - name: Train and track real FD001 experiments
        run: python -m src.train --raw-dir data/raw
      - run: python -m pytest -q
